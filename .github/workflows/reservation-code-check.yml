name: Reservation code check
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/admin-mobile-home-calendar-navigation-20261018
jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Verify tuition calculations and manual entries
        run: |
          node tests/student-registration-validation.test.mjs
          node tests/booking-tuition.test.mjs
          node tests/booking-revenue.test.mjs
          node tests/manual-block-revenue.test.mjs
          node tests/admin-pwa.test.mjs
      - name: Build app
        run: npm run build
      - name: Verify installed administrator launch route
        run: node tests/admin-pwa-live-page.test.mjs
