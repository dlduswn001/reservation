<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6b4f3b" />
    <title>인터넷 연결 확인 | 문장학교 예약</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fbf1e4 url('/images/reading-background.png') right bottom / cover no-repeat;
        color: #222;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      }
      main {
        width: min(100%, 520px);
        padding: 28px;
        border: 1px solid #eadfd4;
        border-radius: 22px;
        background: rgba(255,255,255,.94);
        box-shadow: 0 12px 28px rgba(70,50,35,.08);
      }
      h1 { margin: 0 0 12px; font-size: 27px; }
      p { margin: 0; color: #76706a; line-height: 1.7; }
      button {
        margin-top: 20px;
        border: 0;
        border-radius: 16px;
        padding: 13px 18px;
        background: #6b4f3b;
        color: #fff;
        font-size: 16px;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>인터넷 연결을 확인해 주세요</h1>
      <p>예약 정보는 인터넷이 연결되어야 확인할 수 있어요. 연결 상태를 확인한 뒤 다시 시도해 주세요.</p>
      <button type="button" onclick="location.reload()">다시 시도하기</button>
    </main>
  </body>
</html>
